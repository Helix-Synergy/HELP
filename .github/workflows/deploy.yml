name: Deploy HELP Backend

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "=================================="
            echo "Starting HELP Backend Deployment"
            echo "=================================="

            cd /home/ubuntu/HELP

            echo "Pulling latest code..."
            git pull origin main

            echo "Moving to server folder..."
            cd server

            echo "Installing dependencies..."
            npm install

            echo "Restarting PM2..."
            pm2 restart help-backend --update-env

            echo "Saving PM2..."
            pm2 save

            echo "=================================="
            echo "HELP Backend deployed successfully!"
            echo "=================================="